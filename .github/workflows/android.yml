name: Android APK

# Jeder Push auf main baut eine signierte APK und veröffentlicht sie als neuestes Release.
# Fester Download-Link: https://github.com/<besitzer>/<repo>/releases/latest/download/morgen-quest.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # Android-SDK ist hier vorinstalliert
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - run: npm ci
      - run: npm run sync

      - name: Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt (siehe README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morgen-quest.jks"

      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/morgen-quest.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: morgenquest
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          set -o pipefail
          cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../morgen-quest.apk

      - name: Build-Fehler anzeigen
        if: failure()
        run: |
          grep -vE "^> Task" gradle.log | grep -E "error:|What went wrong|^e: |Could not|not found|FAILED|Exception" -A4 | head -c 3500 | tr '\n' '|' | sed 's/^/::error title=Gradle::/' ; echo

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Morgen-Quest 1.0.${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy: morgen-quest.apk antippen.
            Ein Update wird einfach über die alte Version installiert, der Spielstand bleibt.
          files: morgen-quest.apk
          make_latest: true
